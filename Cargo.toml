[package]
name = "vulp"
version = "0.1.0"
edition = "2021"
description = "Multi-repo git workflow manager"
authors = ["dualfroz"]
license = "MIT"
repository = "https://github.com/dualfroz/fxg"
readme = "README.md"
keywords = ["git", "tui", "cli", "workflow", "productivity"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"

[[bin]]
name = "vulp"
path = "src/main.rs"

[dependencies]
anyhow       = "1"
async-trait  = "0.1"
chrono       = { version = "0.4", features = ["serde"] }
clap         = { version = "4", features = ["derive"] }
crossterm    = "0.28"
dirs         = "5"
futures      = "0.3"
git2         = { version = "0.19", features = ["vendored-openssl", "vendored-libgit2"] }
inquire      = "0.7"
keyring      = "3"
ratatui      = "0.28"
libc         = "0.2"
reqwest      = { version = "0.12", features = ["json"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
signal-hook  = "0.3"
tokio        = { version = "1", features = ["full"] }
toml         = "0.8"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
